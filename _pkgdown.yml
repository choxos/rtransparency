url: https://choxos.github.io/rtransparency/

template:
  bootstrap: 5

navbar:
  structure:
    left:  [intro, articles, reference, news]
    right: [search, github]

articles:
- title: Articles
  navbar: ~
  contents:
  - rtransparency
  - transparency-summary
  - ai-disclosure
  - scope-and-limitations

reference:
- title: Package
  contents:
  - rtransparency-package
- title: Run all detectors
  desc: Detect every indicator in one pass, for one file or a whole corpus.
  contents:
  - rt_all
  - rt_all_pdf
  - rt_all_pmc
  - rt_all_pmc_dir
  - rt_all_txt_dir
- title: Individual indicators (PMC XML)
  desc: One detector per indicator, for PMC JATS XML files.
  contents:
  - rt_coi_pmc
  - rt_fund_pmc
  - rt_register_pmc
  - rt_novelty_pmc
  - rt_replication_pmc
  - rt_data_code_pmc
  - rt_data_code_pmc_list
  - rt_ai_pmc
  - rt_oa_pmc
  - rt_reporting_pmc
- title: Individual indicators (text)
  desc: One detector per indicator, for plain-text (PDF-derived) files.
  contents:
  - rt_coi
  - rt_fund
  - rt_register
  - rt_novelty
  - rt_replication
  - rt_data_code
  - rt_ai
  - rt_oa
  - rt_reporting
- title: Get articles
  desc: Download PMC full text, convert identifiers and read PDFs.
  contents:
  - rt_fetch_pmc
  - rt_convert_ids
  - rt_read_pdf
- title: Structured metadata (PMC XML)
  desc: Tagged JATS metadata read directly, not detected from prose.
  contents:
  - rt_meta_pmc
  - rt_authors_pmc
  - rt_funders_pmc
- title: Follow-up checks
  desc: Go beyond presence of a statement, using registries, PubMed and the web.
  contents:
  - rt_trial_ids
  - rt_registration_timing
  - rt_coi_pubmed
  - rt_fill_coi_pubmed
  - rt_check_links
- title: Experimental
  desc: Detectors not yet validated against hand labels; not part of rt_all_pmc().
  contents:
  - rt_ethics_pmc
  - rt_ethics
- title: Summarize and visualize
  desc: Corpus-level prevalence, per-article scores and plots.
  contents:
  - rt_summary
  - rt_score
  - rt_plot
- title: Datasets
  contents:
  - rt_accuracy
  - rt_accuracy_2021
  - rt_demo
