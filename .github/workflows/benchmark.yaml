# Detector regression gate: re-runs rt_all_pmc() on the cached benchmark
# articles and fails if any decision differs from the committed
# data-raw/benchmark/predictions_snapshot.csv. The PMC XML is cached between
# runs; a cold cache is filled from NCBI (about 15 minutes).
on:
  workflow_dispatch:
  pull_request:
    paths: ["R/**", "data-raw/benchmark/predictions_snapshot.csv"]

name: benchmark.yaml

permissions: read-all

jobs:
  regression:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      ENTREZ_KEY: ${{ secrets.ENTREZ_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgload, local::.

      - uses: actions/cache@v4
        with:
          path: data-raw/benchmark/.cache
          key: benchmark-xml-v1-${{ hashFiles('data-raw/benchmark/predictions_snapshot.csv') }}
          restore-keys: benchmark-xml-v1-

      - name: Fetch missing XML
        run: |
          pkgload::load_all(quiet = TRUE)
          ids <- read.csv("data-raw/benchmark/predictions_snapshot.csv")$pmcid
          got <- rt_fetch_pmc(ids, "data-raw/benchmark/.cache", progress = FALSE)
          # The check step skips (and lists) articles that could not be fetched.
          if (!all(got$is_success)) message(sum(!got$is_success), " downloads failed")
        shell: Rscript {0}

      - name: Check predictions
        run: Rscript data-raw/benchmark/snapshot.R check data-raw/benchmark/predictions_snapshot.csv
